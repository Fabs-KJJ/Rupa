<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FFFFFF;
    --cream-warm: #FAF4E8;
    --cream-dark: #F0F0F0;
    --gold: #D8B045;
    --gold-light: #E5C55A;
    --gold-pale: #F2E4A8;
    --brown: #281d02;
    --brown-light: #4d3a14;
    --text-muted: #808080;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  html { scroll-behavior: smooth; scrollbar-width: none; }
  body { background: #281d02; font-family: 'Montserrat', sans-serif; color: var(--brown); overflow-x: hidden; }
  ::-webkit-scrollbar { display: none; }
  .page { background: var(--cream); border-radius: 24px; margin: 16px auto; max-width: 1600px; overflow: hidden; position: relative; box-shadow: 0 40px 120px rgba(0,0,0,0.6); }

  /* ── Staggered Menu ── */
  .staggered-menu-wrapper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 200; pointer-events: none; overflow: hidden; --sm-accent: var(--gold); }
  .staggered-menu-header { position: absolute; top: 0; left: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 24px 40px; pointer-events: none; z-index: 220; }
  .staggered-menu-header > * { pointer-events: auto; }
  .sm-logo { display: flex; align-items: center; user-select: none; }
  .sm-logo-img { display: block; height: 40px; width: auto; object-fit: contain; }
  .sm-toggle { position: relative; display: inline-flex; align-items: center; gap: 14px; background: var(--gold); border: none; cursor: pointer; color: var(--brown); font-weight: 700; line-height: 1; padding: 8px 18px 8px 14px; border-radius: 100px; font-family: 'Montserrat', sans-serif; font-size: 16px; letter-spacing: 0.02em; transition: background 200ms, color 200ms; }
  .sm-toggle:hover { background: var(--gold-light); }
  .sm-toggle-textWrap { position: relative; display: inline-block; height: 1em; overflow: hidden; white-space: nowrap; }
  .sm-toggle-textInner { display: flex; flex-direction: column; line-height: 1; }
  .sm-toggle-line { display: block; height: 1em; line-height: 1; }
  .sm-icon { position: relative; width: 20px; height: 20px; flex: 0 0 20px; display: inline-flex; align-items: center; justify-content: center; will-change: transform; }
  .sm-icon-line { position: absolute; left: 50%; top: 50%; width: 100%; height: 3px; background: currentColor; border-radius: 3px; transform: translate(-50%,-50%); will-change: transform; }
  .staggered-menu-panel { position: absolute; top: 0; right: 0; width: clamp(280px, 38vw, 440px); height: 100%; background: #FAF4E8; display: flex; flex-direction: column; padding: 110px 48px 40px; overflow-y: auto; z-index: 210; pointer-events: auto; opacity: 0; }
  .sm-prelayers { position: absolute; top: 0; right: 0; bottom: 0; width: clamp(280px, 38vw, 440px); pointer-events: none; z-index: 205; opacity: 0; }
  .sm-prelayer { position: absolute; top: 0; right: 0; height: 100%; width: 100%; transform: translateX(0); opacity: 0; }
  .sm-panel-list { list-style: none; display: flex; flex-direction: column; gap: 4px; margin-bottom: 48px; }
  .sm-panel-itemWrap { overflow: hidden; }
  .sm-panel-item { display: block; font-family: 'Big Shoulders Display', sans-serif; font-size: clamp(32px, 4.5vw, 52px); font-weight: 700; letter-spacing: 1px; color: var(--brown); text-decoration: none; padding: 4px 0; line-height: 1.1; transition: color 200ms; transform: translateY(100%); will-change: transform; }
  .sm-panel-item:hover { color: var(--gold); }
  .sm-socials-title { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }
  .sm-socials-list { list-style: none; display: flex; gap: 20px; }
  .sm-socials-link { color: var(--brown); text-decoration: none; display: inline-flex; transition: color 200ms; }
  .sm-socials-link:hover { color: var(--gold); }

  /* ── ARTICLE HERO ── */
  .article-hero { position: relative; height: 520px; overflow: hidden; }
  .article-hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .article-hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(40,29,2,0.1) 0%, rgba(40,29,2,0.65) 100%); }
  .article-hero-meta { position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 80px; }
  .article-cat { display: inline-block; font-family: 'Josefin Sans', sans-serif; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; background: var(--gold); color: white; padding: 5px 14px; border-radius: 100px; margin-bottom: 16px; }
  .article-headline { font-family: 'Cormorant Garamond', serif; font-size: clamp(32px, 5vw, 58px); font-weight: 600; color: white; line-height: 1.1; max-width: 800px; }
  .article-date { font-family: 'Josefin Sans', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-top: 14px; }

  /* ── ARTICLE BODY ── */
  .article-wrap { max-width: 760px; margin: 0 auto; padding: 64px 40px 80px; }
  .article-back { display: inline-flex; align-items: center; gap: 8px; font-family: 'Josefin Sans', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); text-decoration: none; margin-bottom: 48px; transition: color 200ms; }
  .article-back:hover { color: var(--gold); }
  .article-back svg { width: 14px; height: 14px; }
  .article-lead { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; line-height: 1.6; color: var(--brown); margin-bottom: 32px; }
  .article-body p { font-size: 15px; font-weight: 400; line-height: 1.85; color: #444; margin-bottom: 24px; }
  .article-body h3 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; color: var(--brown); margin: 40px 0 16px; }
  .article-divider { border: none; border-top: 1px solid rgba(216,176,69,0.3); margin: 40px 0; }

  /* ── NOT FOUND ── */
  .not-found { text-align: center; padding: 120px 40px; }
  .not-found h2 { font-family: 'Cormorant Garamond', serif; font-size: 40px; color: var(--brown); margin-bottom: 16px; }
  .not-found p { color: var(--text-muted); margin-bottom: 32px; }

  /* ── FOOTER ── */
  footer { background: var(--cream-dark); padding: 48px 0 0; }
  .footer-top { max-width: 1200px; margin: 0 auto; padding: 0 60px 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 40px; }
  .footer-address { font-size: 10px; letter-spacing: 1.5px; line-height: 2; text-transform: uppercase; color: var(--text-muted); }
  .footer-logo-center { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  .footer-tagline { font-family: 'Cormorant Garamond', serif; font-size: 13px; font-style: italic; color: var(--text-muted); text-align: right; line-height: 1.6; max-width: 260px; margin-left: auto; }
  .footer-socials { max-width: 1200px; margin: 0 auto; padding: 24px 60px; border-top: 1px solid rgba(200,131,10,0.2); display: flex; justify-content: center; align-items: center; gap: 32px; }
  .social-link { display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; transition: color 200ms var(--ease-out); }
  .social-link:hover { color: var(--gold); }
  .footer-bottom { max-width: 1200px; margin: 0 auto; padding: 20px 60px; border-top: 1px solid rgba(200,131,10,0.15); display: flex; align-items: center; justify-content: space-between; }
  .footer-copy { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
  .footer-brand { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 4px; color: var(--gold); }
  .footer-legal { display: flex; gap: 24px; }
  .footer-legal a { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); text-decoration: none; }

  @media (max-width: 900px) {
    .article-hero { height: 380px; }
    .article-hero-meta { padding: 28px 40px; }
    .article-wrap { padding: 48px 40px 64px; }
    .footer-top { padding: 0 40px 40px; }
    .footer-socials { padding: 20px 40px; }
    .footer-bottom { padding: 16px 40px; }
  }
  @media (max-width: 640px) {
    .article-hero { height: 280px; }
    .article-hero-meta { padding: 20px 24px; }
    .article-wrap { padding: 36px 24px 56px; }
    .page { margin: 0; border-radius: 0; }
    .footer-top { padding: 0 20px 28px; grid-template-columns: 1fr auto; gap: 20px; }
    .footer-tagline { display: none; }
    .footer-socials { padding: 16px 20px; flex-wrap: wrap; gap: 14px; }
    .footer-bottom { padding: 14px 20px; flex-wrap: wrap; gap: 8px; }
  }
</style>

<script>
/* ── Staggered menu ── */
(function() {
  const wrapper = document.querySelector('.staggered-menu-wrapper');
  if (!wrapper || typeof gsap === 'undefined') return;
  const position = wrapper.getAttribute('data-position') || 'right';
  const panel = wrapper.querySelector('.staggered-menu-panel');
  const preLayers = Array.from(wrapper.querySelectorAll('.sm-prelayer'));
  const preContainer = wrapper.querySelector('.sm-prelayers');
  const toggleBtn = wrapper.querySelector('.sm-toggle');
  const icon = wrapper.querySelector('.sm-icon');
  const plusH = wrapper.querySelector('.sm-icon-line:not(.sm-icon-line-v)');
  const plusV = wrapper.querySelector('.sm-icon-line-v');
  const textInner = wrapper.querySelector('.sm-toggle-textInner');
  const itemEls = Array.from(wrapper.querySelectorAll('.sm-panel-itemLabel'));
  const offscreen = position === 'left' ? -100 : 100;
  let open = false, busy = false;

  gsap.set(panel, { xPercent: offscreen, opacity: 1 });
  gsap.set(preContainer, { opacity: 1 });
  preLayers.forEach(l => gsap.set(l, { xPercent: offscreen, opacity: 1 }));
  itemEls.forEach(el => gsap.set(el.parentElement, { y: '100%' }));

  function openMenu() {
    if (busy) return; busy = true; open = true;
    wrapper.style.pointerEvents = 'auto';
    toggleBtn.setAttribute('aria-expanded', 'true');
    panel.setAttribute('aria-hidden', 'false');
    const tl = gsap.timeline({ onComplete: () => { busy = false; } });
    preLayers.forEach((l, i) => {
      tl.to(l, { xPercent: 0, duration: 0.32, ease: 'power3.out' }, i * 0.06);
    });
    tl.to(panel, { xPercent: 0, duration: 0.4, ease: 'power3.out' }, 0.08);
    tl.to(itemEls.map(el => el.parentElement), { y: '0%', duration: 0.45, ease: 'power3.out', stagger: 0.055 }, 0.22);
    gsap.to(plusV, { rotation: 45, transformOrigin: '50% 50%', duration: 0.3, ease: 'power2.out' });
    gsap.to(plusH, { rotation: 45, transformOrigin: '50% 50%', duration: 0.3, ease: 'power2.out' });
  }
  function closeMenu() {
    if (busy) return; busy = true; open = false;
    toggleBtn.setAttribute('aria-expanded', 'false');
    panel.setAttribute('aria-hidden', 'true');
    const tl = gsap.timeline({ onComplete: () => { busy = false; wrapper.style.pointerEvents = 'none'; } });
    tl.to(itemEls.map(el => el.parentElement), { y: '100%', duration: 0.3, ease: 'power2.in', stagger: 0.03 }, 0);
    tl.to(panel, { xPercent: offscreen, duration: 0.38, ease: 'power3.in' }, 0.1);
    preLayers.slice().reverse().forEach((l, i) => {
      tl.to(l, { xPercent: offscreen, duration: 0.28, ease: 'power3.in' }, 0.15 + i * 0.05);
    });
    gsap.to(plusV, { rotation: 90, transformOrigin: '50% 50%', duration: 0.3, ease: 'power2.out' });
    gsap.to(plusH, { rotation: 0, transformOrigin: '50% 50%', duration: 0.3, ease: 'power2.out' });
  }
  toggleBtn.addEventListener('click', () => open ? closeMenu() : openMenu());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) closeMenu(); });
}());
</script>
